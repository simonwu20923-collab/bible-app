<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Recording your reading…</title>
<!--
  Landing page for the Finish NT / Finish OT links in the daily email.

  Deliberately a standalone file rather than a route in the app: this runs on a
  phone the moment someone taps a button in their inbox, and loading the whole
  React bundle to write one row would make them wait for no reason.

  The write happens here in the browser rather than on the link itself, because
  mail scanners fetch every URL in a message to vet it — a link that recorded on
  GET would log readings nobody did. Scanners do not run scripts.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg:#f4f2f9; --card:#ffffff; --ink:#1a1726; --dim:#6b6580;
    --brand:#6d28d9; --ok:#059669; --warn:#b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f1a; --card:#17172a; --ink:#e9e6f2; --dim:#948ea8;
            --brand:#a78bfa; --ok:#34d399; --warn:#e0a45c; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  .card {
    background:var(--card); border-radius:16px; padding:40px 32px; width:100%; max-width:420px;
    text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.10);
  }
  .mark { font-size:56px; line-height:1; margin-bottom:14px; }
  h1 { margin:0 0 8px; font-size:24px; letter-spacing:-0.01em; }
  p  { margin:0; color:var(--dim); font-size:15px; line-height:1.6; }
  .portion { color:var(--ok); font-weight:700; }
  .muted   { margin-top:20px; font-size:13px; }
  a { color:var(--brand); font-weight:600; text-decoration:none; }
  .spinner {
    width:34px; height:34px; margin:0 auto 16px; border-radius:50%;
    border:3px solid rgba(128,128,128,.25); border-top-color:var(--brand);
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Recording…</h1>
    <p id="body">One moment.</p>
  </div>

<script>
(function () {
  // The publishable key is public by design — it is already in the site bundle.
  var SUPABASE_URL = 'https://lsvhmvkhernimxmzcyak.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_VC2J0-DqMbG87ANco-xAvA_7SslVPKc';
  var SITE = 'https://bible.churchincerritos.org';
  var NAMES = { NT: 'New Testament', OT: 'Old Testament' };

  function show(mark, title, body, extra) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('title').textContent = title;
    document.getElementById('body').innerHTML = body;
    var m = document.createElement('div');
    m.className = 'mark';
    m.textContent = mark;
    var card = document.getElementById('card');
    card.insertBefore(m, card.firstChild);
    if (extra) {
      var p = document.createElement('p');
      p.className = 'muted';
      p.innerHTML = extra;
      card.appendChild(p);
    }
  }

  var token = new URLSearchParams(location.search).get('t');
  if (!token) {
    show('⚠️', 'Link incomplete', 'This link is missing its code. Open the reading on the site to mark it instead.',
         '<a href="' + SITE + '/reading">Go to today’s reading</a>');
    return;
  }

  fetch(SUPABASE_URL + '/functions/v1/verify-checkin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY },
    body: JSON.stringify({ token: token })
  })
  .then(function (r) { return r.json(); })
  .then(function (r) {
    if (!r.ok) {
      show('⚠️', 'Couldn’t log that', r.error || 'That link could not be used.',
           '<a href="' + SITE + '/reading">Mark it on the site instead</a>');
      return;
    }
    var portion = '<span class="portion">' + (NAMES[r.portion] || r.portion) + '</span>';
    show(
      r.already ? '👍' : '✅',
      r.already ? 'Already logged' : 'Logged!',
      portion + ' for ' + r.date + (r.already ? ' was already marked finished.' : ' is marked finished.'),
      'You can close this tab. &middot; <a href="' + SITE + '/reading?date=' + r.date + '">Open the reading</a>'
    );
    document.title = r.already ? 'Already logged' : 'Logged!';
  })
  .catch(function () {
    show('⚠️', 'Couldn’t reach the server', 'Please try again in a moment.',
         '<a href="' + SITE + '/reading">Mark it on the site instead</a>');
  });
})();
</script>
</body>
</html>
